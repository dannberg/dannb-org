[build]
publish = "public"
command = "hugo --gc --minify"
# Skip the deploy when the ONLY changed files are root docs (readme.md / CLAUDE.md).
# Netlify runs this before building: exit 0 cancels the build, non-zero proceeds.
# git diff --quiet exits 0 when nothing outside the excluded paths changed.
ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':(exclude)readme.md' ':(exclude)CLAUDE.md'"

[context.production.environment]
HUGO_VERSION = "0.161.1"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.split1]
command = "hugo --gc --minify --enableGitInfo"

[context.split1.environment]
HUGO_VERSION = "0.161.1"
HUGO_ENV = "production"

[context.deploy-preview]
command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
HUGO_VERSION = "0.161.1"

[context.branch-deploy]
command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
HUGO_VERSION = "0.161.1"

[context.next.environment]
HUGO_ENABLEGITINFO = "true"
